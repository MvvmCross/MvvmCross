name: dotnet format

on: [pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

    - uses: ./.github/actions/shared

    - name: Run dotnet format
      run: |
        dotnet format whitespace --no-restore --verify-no-changes MvvmCross.slnx
