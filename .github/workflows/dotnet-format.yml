name: dotnet format

on: [pull_request]

jobs:
  lint:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - uses: ./.github/actions/shared-net

    - name: Run dotnet format
      run: |
        dotnet format whitespace --no-restore --verify-no-changes MvvmCross.slnx
