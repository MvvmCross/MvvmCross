name: dotnet format

on: [pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - uses: ./.github/actions/shared

    - name: Run dotnet format
      run: |
        dotnet format whitespace --no-restore --verify-no-changes MvvmCross.slnx
