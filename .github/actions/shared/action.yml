name: "Shared Steps"
description: Shared steps for .NET and Java setup
inputs:
  dotnet-version:
    description: 'The .NET version to install'
    required: false
    default: '10.0.300'
  dotnet-workload-version:
    description: 'The .NET workload version to install'
    required: false
    default: '10.0.300.1'
  java-version:
    description: 'The Java version to install'
    required: false
    default: '21'
  java-distribution:
    description: 'The Java distribution to install'
    required: false
    default: 'temurin'
runs:
  using: "composite"
  steps:
    - name: Install .NET ${{ inputs.dotnet-version }}
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore .NET tools
      shell: pwsh
      run: dotnet tool restore

    - name: Install .NET workloads
      shell: pwsh
      run: |
        dotnet --version
        dotnet workload install android ios tvos macos maccatalyst --version $Env:DotnetWorkloadVersion
      env:
        DotnetWorkloadVersion: ${{ inputs.dotnet-workload-version }}

    - name: Set up JDK
      uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}