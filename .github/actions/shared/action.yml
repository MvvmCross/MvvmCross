name: "Shared Steps"
description: Shared steps for .NET and Java setup
inputs:
  dotnet-version:
    description: 'The .NET version to install'
    required: false
    default: '11.0.100'
  dotnet-workload-version:
    description: 'The .NET workload version to install'
    required: false
    default: '11.0.100.1'
  java-version:
    description: 'The Java version to install'
    required: false
    default: '21'
  java-distribution:
    description: 'The Java distribution to install'
    required: false
    default: 'temurin'
runs:
  using: "composite"
  steps:
    - name: Install .NET ${{ inputs.dotnet-version }}
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        workloads: android, ios, tvos, macos, maccatalyst

    - name: Restore .NET tools
      shell: pwsh
      run: dotnet tool restore

    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}