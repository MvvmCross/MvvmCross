name: "Shared Steps"
description: Shared steps for .NET and Java setup
inputs:
  dotnet-version:
    description: 'The .NET version to install'
    required: false
    default: '10.0.300'
  dotnet-workload-version:
    description: 'The .NET workload version to install'
    required: false
    default: '10.0.300.1'
  java-version:
    description: 'The Java version to install'
    required: false
    default: '21'
  java-distribution:
    description: 'The Java distribution to install'
    required: false
    default: 'temurin'
runs:
  using: "composite"
  steps:
    - name: Install .NET ${{ inputs.dotnet-version }}
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore .NET tools
      shell: pwsh
      run: dotnet tool restore

    - name: Install .NET workloads
      shell: pwsh
      run: |
        dotnet --version
        dotnet workload install android ios tvos macos maccatalyst --version $Env:DotnetWorkloadVersion
      env:
        DotnetWorkloadVersion: ${{ inputs.dotnet-workload-version }}

    - name: Set up JDK
      uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}