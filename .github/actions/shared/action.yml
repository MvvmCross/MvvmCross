name: "Shared Steps"
description: Shared steps for .NET and Java setup
inputs:
  dotnet-version:
    description: 'The .NET version to install'
    required: false
    default: '10.0.100'
  dotnet-workload-version:
    description: 'The .NET workload version to install'
    required: false
    default: '10.0.100'
  java-version:
    description: 'The Java version to install'
    required: false
    default: '21'
  java-distribution:
    description: 'The Java distribution to install'
    required: false
    default: 'temurin'
runs:
  using: "composite"
  steps:
    - name: Install .NET ${{ inputs.dotnet-version }}
      uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore .NET tools
      shell: pwsh
      run: dotnet tool restore

    - name: Install .NET workloads
      shell: pwsh
      run: |
        dotnet --version
        dotnet workload install android ios tvos macos maccatalyst --version ${{ inputs.dotnet-workload-version }}

    - name: Set up JDK
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}