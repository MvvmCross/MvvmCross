name: "Shared Steps"
description: Shared steps for .NET and Java setup
inputs:
  dotnet-version:
    description: 'The .NET version to install'
    required: false
    default: '11.0.100'
  dotnet-workload-version:
    description: 'The .NET workload version to install'
    required: false
    default: '11.0.100.1'
  java-version:
    description: 'The Java version to install'
    required: false
    default: '21'
  java-distribution:
    description: 'The Java distribution to install'
    required: false
    default: 'temurin'
runs:
  using: "composite"
  steps:
    - name: Install .NET ${{ inputs.dotnet-version }}
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        workloads: android, ios, tvos, macos, maccatalyst

    - name: Restore .NET tools
      shell: pwsh
      run: dotnet tool restore

    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}